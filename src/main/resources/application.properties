spring.application.name=edutrack-backend

# IMPORTANT for Railway
server.port=${PORT:8080}

# Use Railway MySQL environment variables.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

springdoc.swagger-ui.path=/swagger-ui.html

# Move secret to env variable
app.jwt.secret=${JWT_SECRET:VGhpc0lzRGVmYXVsdFNlY3JldEtleQ==}
app.jwt.expiration-ms=86400000
